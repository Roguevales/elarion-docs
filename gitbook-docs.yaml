$schema: https://api.gitbook.com/gitbook-docs.yaml
site:
  title: Elarion Docs
  structure:
    - type: section
      key: section-1
      title: Start Here
      path: start-here
      description: Begin with the essentials, learn how the documentation is organized, and find the right guide quickly.
      icon: compass
      children:
        - type: space
          key: space-1
          title: Start Here
          path: documentation
          default: true
          hidden: true
          content:
            directory: ./documentation
    - type: section
      key: section-2
      title: Discord Markdown
      path: discord-markdown
      description: A practical reference for Discord text formatting, message styling, code blocks, links, lists, and other Markdown syntax.
      default: true
      children:
        - type: space
          key: space-2
          title: Discord Markdown
          path: product-docs
          default: true
          content:
            directory: ./discord-markdown/product-docs
